<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patient Login - Clinic Management System</title>
    <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="../index.html">🏥 Clinic Management System</a>
        </div>
    </nav>

    <div class="container-narrow" style="margin-top:40px;">
        <div id="alertBox" class="alert"></div>

        <div class="panel">
            <h3 class="section-title">🧑 Patient Sign In</h3>
            <p>Already registered? Enter the email you used when signing up.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="loginEmail" required placeholder="e.g. sara.ahmed@example.com" />
                </div>
                <button type="submit" class="btn btn-primary btn-block">Continue</button>
            </form>
        </div>

        <div class="panel">
            <h3 class="section-title">➕ New Patient? Register</h3>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" id="regName" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="regEmail" required />
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" class="form-control" id="regDob" required />
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" id="regPhone" placeholder="optional" />
                </div>
                <button type="submit" class="btn btn-success btn-block">Create Account</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();

            try {
                const patients = await Api.getPatients();
                const match = patients.find(p => p.email.toLowerCase() === email);
                if (!match) {
                    showAlert("No patient found with that email. Please register below.");
                    return;
                }
                Session.setPatient(match);
                window.location.href = "dashboard.html";
            } catch (err) {
                showAlert(err.message);
            }
        });

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const dto = {
                fullName: document.getElementById("regName").value.trim(),
                email: document.getElementById("regEmail").value.trim(),
                dateOfBirth: document.getElementById("regDob").value,
                phoneNumber: document.getElementById("regPhone").value.trim() || null
            };

            try {
                const created = await Api.createPatient(dto);
                Session.setPatient(created);
                window.location.href = "dashboard.html";
            } catch (err) {
                showAlert(err.message);
            }
        });
    </script>
</body>
</html>
