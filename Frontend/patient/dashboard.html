<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patient Dashboard - Clinic Management System</title>
    <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="../index.html">🏥 Clinic Management System</a>
            <ul class="navbar-links">
                <li><a href="#" id="logoutLink">Log Out</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top:25px;">
        <div id="alertBox" class="alert"></div>

        <div class="row">
            <!-- Profile + Booking -->
            <div class="col">
                <div class="panel">
                    <h3 class="section-title">🪪 My Profile</h3>
                    <p><strong>Name:</strong> <span id="pName"></span></p>
                    <p><strong>Email:</strong> <span id="pEmail"></span></p>
                    <p><strong>Date of Birth:</strong> <span id="pDob"></span></p>
                    <p><strong>Phone:</strong> <span id="pPhone"></span></p>
                </div>

                <div class="panel">
                    <h3 class="section-title">🩺 Book an Appointment</h3>
                    <form id="bookForm">
                        <div class="form-group">
                            <label>Doctor</label>
                            <select class="form-control" id="doctorSelect" required></select>
                        </div>
                        <div class="form-group">
                            <label>Date &amp; Time</label>
                            <input type="datetime-local" class="form-control" id="apptDate" required />
                        </div>
                        <div class="form-group">
                            <label>Reason</label>
                            <textarea class="form-control" id="apptReason" rows="2" placeholder="Briefly describe your reason for visiting"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Request Appointment</button>
                    </form>
                </div>
            </div>

            <!-- Appointment history -->
            <div class="col-wide">
                <div class="panel">
                    <h3 class="section-title">📋 My Appointments</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Reason</th>
                                <th>Doctor Notes</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsBody">
                            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const patient = Session.getPatient();
        if (!patient) {
            window.location.href = "login.html";
        }

        document.getElementById("pName").textContent = patient.fullName;
        document.getElementById("pEmail").textContent = patient.email;
        document.getElementById("pDob").textContent = new Date(patient.dateOfBirth).toLocaleDateString();
        document.getElementById("pPhone").textContent = patient.phoneNumber || "—";

        document.getElementById("logoutLink").addEventListener("click", (e) => {
            e.preventDefault();
            Session.clearPatient();
            window.location.href = "../index.html";
        });

        async function loadDoctors() {
            const select = document.getElementById("doctorSelect");
            try {
                const doctors = await Api.getDoctors();
                select.innerHTML = doctors.map(d =>
                    `<option value="${d.id}">${d.fullName} — ${d.specialization}</option>`
                ).join("");
            } catch (err) {
                showAlert(err.message);
            }
        }

        async function loadAppointments() {
            const body = document.getElementById("appointmentsBody");
            try {
                const appointments = await Api.getAppointmentsByPatient(patient.id);
                if (appointments.length === 0) {
                    body.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No appointments yet.</td></tr>`;
                    return;
                }
                body.innerHTML = appointments.map(a => `
                    <tr>
                        <td>${a.doctorName ?? ("Doctor #" + a.doctorId)}</td>
                        <td>${new Date(a.appointmentDate).toLocaleString()}</td>
                        <td>${statusBadge(a.status)}</td>
                        <td>${a.reason ?? "—"}</td>
                        <td>${a.doctorNotes ?? "—"}</td>
                        <td>
                            ${a.status === 0 ? `<button class="btn btn-danger btn-sm" onclick="cancelAppointment(${a.id})">Cancel</button>` : ""}
                        </td>
                    </tr>
                `).join("");
            } catch (err) {
                showAlert(err.message);
            }
        }

        async function cancelAppointment(id) {
            if (!confirm("Cancel this appointment?")) return;
            try {
                await Api.cancelAppointment(id);
                showAlert("Appointment cancelled.", "success");
                loadAppointments();
            } catch (err) {
                showAlert(err.message);
            }
        }

        document.getElementById("bookForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const dto = {
                patientId: patient.id,
                doctorId: parseInt(document.getElementById("doctorSelect").value, 10),
                appointmentDate: document.getElementById("apptDate").value,
                reason: document.getElementById("apptReason").value.trim() || null
            };

            try {
                await Api.bookAppointment(dto);
                showAlert("Appointment requested! Waiting for the doctor's approval.", "success");
                document.getElementById("bookForm").reset();
                loadAppointments();
            } catch (err) {
                showAlert(err.message);
            }
        });

        loadDoctors();
        loadAppointments();
    </script>
</body>
</html>
